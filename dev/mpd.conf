# MPD-Konfiguration für die lokale Testumgebung (Container).
#
# Bewusst minimal: kein Audio-Output-Gerät, sondern ein Null-Output. Es geht
# um Bibliothek, Gruppierung, Kapitel und Resume — nicht darum, etwas zu hören.
# Damit läuft der Container ohne Zugriff auf die Soundkarte des Hosts.

music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/database"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"

log_file            "stdout"
log_level           "default"

bind_to_address     "0.0.0.0"
port                "6600"

# Ohne Auto-Update muss nach Fixture-Änderungen manuell `update` geschickt
# werden. Mit Auto-Update verhält sich der Container wie der inotify-Watcher
# auf dem Pi.
auto_update         "yes"
auto_update_depth   "10"

# Symlinks folgen — relevant, falls im Testbestand doch mal welche auftauchen.
follow_outside_symlinks "yes"
follow_inside_symlinks  "yes"

# Null-Output: MPD spielt in Echtzeit ins Nichts. Positionen, Kapitelsprünge
# und Resume verhalten sich dadurch wie bei echtem Audio.
audio_output {
    type    "null"
    name    "Null Output"
    mixer_type "software"
}
